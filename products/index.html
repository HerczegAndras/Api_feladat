<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Termékek kezelése</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="stlye2.css">
</head>
<body>

    <main class="container py-5" style="max-width: 1200px;">
        
        <div class="card border-0 shadow rounded-4 overflow-hidden mb-5">
            <div class="card-header emerald-header text-white border-0 py-3 px-4">
                <h2 class="h5 fw-bold mb-0">
                    <i class="bi bi-box-seam-fill me-2"></i>Új termék felvétele
                </h2>
            </div>
            
            <div class="card-body bg-white p-4">
                <form id="product-form">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="prod-name" class="form-label fw-semibold text-emerald">Termék neve</label>
                            <input type="text" class="form-control" id="prod-name" placeholder="pl. Okosóra" required>
                        </div>
                        <div class="col-md-6">
                            <label for="prod-price" class="form-label fw-semibold text-emerald">Ár (Ft)</label>
                            <input type="number" class="form-control" id="prod-price" placeholder="pl. 25000" required>
                        </div>
                        <div class="col-md-6">
                            <label for="prod-image" class="form-label fw-semibold text-emerald">Kép link (URL)</label>
                            <input type="url" class="form-control" id="prod-image" placeholder="https://pelda.hu/kep.jpg" required>
                        </div>
                        <div class="col-12">
                            <label for="prod-desc" class="form-label fw-semibold text-emerald">Leírás</label>
                            <textarea class="form-control" id="prod-desc" rows="2" placeholder="Rövid termékleírás..." required></textarea>
                        </div>
                    </div>

                    <div class="mt-4 d-flex justify-content-end">
                        <button type="submit" class="btn btn-irish px-4 py-2 fw-semibold">
                            <i class="bi bi-plus-circle me-2"></i>Termék hozzáadása
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="mb-4 px-2">
            <h1 class="h3 fw-bold text-dark mb-1">
                <i class="bi bi-grid-fill text-emerald me-2"></i>Termékek katalógus
            </h1>
            <p class="text-muted small mb-0">Elérhető termékek </p>
        </div>

        <div id="status" class="alert alert-info d-flex align-items-center rounded-3 mb-4" role="status">
            <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
            <span>Termékek betöltése...</span>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="product-list">
        </div>

    </main>

    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4 overflow-hidden">
                <div class="modal-header emerald-header text-white">
                    <h5 class="modal-title fw-bold" id="productModalLabel">
                        <i class="bi bi-info-circle-fill me-2"></i>Termék részletei
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Bezárás"></button>
                </div>
                <div class="modal-body p-0 bg-white">
                    <img id="modal-product-image" src="" alt="Termék képe" class="w-100 object-fit-cover border-bottom" style="height: 240px;">
                    
                    <div class="p-4">
                        <div class="mb-3">
                            <span class="text-uppercase text-muted small fw-semibold d-block">Termék neve</span>
                            <h4 id="modal-product-name" class="fw-bold text-dark mb-0"></h4>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <span class="text-uppercase text-muted small fw-semibold d-block">Ár</span>
                                <span id="modal-product-price" class="fs-5 fw-bold text-emerald"></span>
                            </div>
                        </div>
                        <div>
                            <span class="text-uppercase text-muted small fw-semibold d-block">Leírás</span>
                            <p id="modal-product-desc" class="text-muted mb-0 bg-light p-3 rounded-3"></p>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light border-0 px-4 py-3">
                    <button type="button" class="btn btn-secondary px-4 rounded-pill" data-bs-dismiss="modal">Bezárás</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
