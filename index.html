<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felhasználók</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --irish-green: #169B62;
            --emerald-green: #046307;
            --emerald-light: #e6f4ee;
            --emerald-border: #b7e1cd;
            --bg-mint: #f3f9f6;
        }

        body {
            background-color: var(--bg-mint);
        }

        
        .emerald-header {
            background: linear-gradient(135deg, var(--emerald-green) 0%, var(--irish-green) 100%);
        }

        .badge-irish {
            background-color: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(4px);
        }

        
        #status.alert-info {
            background-color: var(--emerald-light);
            color: var(--emerald-green);
            border: 1px solid var(--emerald-border);
        }

        
        .table-emerald thead th {
            background-color: #f8fcfa;
            color: var(--emerald-green);
            border-bottom: 2px solid var(--emerald-border);
        }

        .table-hover tbody tr:hover {
            background-color: rgba(22, 155, 98, 0.06);
        }
    </style>
</head>
<body>

    <main class="container py-5" style="max-width: 1100px;">
        
     
        <div class="card border-0 shadow rounded-4 overflow-hidden">
            
         
            <div class="card-header emerald-header text-white border-0 py-4 px-4">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <div>
                        <h1 class="h3 fw-bold mb-1">
                            <i class="bi bi-people-fill me-2"></i>Felhasználók
                        </h1>
                        <p class="text-white-50 small mb-0">Regisztrált tagok és jogosultságok áttekintése</p>
                    </div>
                    <span id="user-count" class="badge rounded-pill badge-irish px-3 py-2 fs-6">
                        Betöltés...
                    </span>
                </div>
            </div>

          
            <div class="card-body bg-white p-4">
                
                
                <div id="status" class="alert alert-info d-flex align-items-center rounded-3 mb-4" role="status">
                    <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
                    <span>Felhasználók betöltése...</span>
                </div>

              
                <div class="table-responsive rounded-3 border" style="border-color: var(--emerald-border) !important;">
                    <table class="table table-hover table-emerald align-middle mb-0">
                        <thead class="text-uppercase small fw-semibold">
                            <tr>
                                <th class="py-3 ps-4">Név</th>
                                <th class="py-3">E-mail</th>
                                <th class="py-3">Város</th>
                                <th class="py-3">Telefon</th>
                                <th class="py-3 pe-4 text-end">Szerepkör</th>
                            </tr>
                        </thead>
                        <tbody id="users" class="border-top-0">
                           
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

    </main>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
