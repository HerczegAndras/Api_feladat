<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Felhasználók</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
       
    </style>
</head>
<body>

    <main class="container py-5" style="max-width: 1100px;">
        
     
        <div class="card border-0 shadow rounded-4 overflow-hidden">
            
         
            <div class="card-header emerald-header text-white border-0 py-4 px-4">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                    <div>
                        <h1 class="h3 fw-bold mb-1">
                            <i class="bi bi-people-fill me-2"></i>Felhasználók
                        </h1>
                        <p class="text-white-50 small mb-0">Regisztrált tagok és jogosultságok áttekintése</p>
                    </div>
                    <span id="user-count" class="badge rounded-pill badge-irish px-3 py-2 fs-6">
                        Betöltés...
                    </span>
                </div>
            </div>

          
            <div class="card-body bg-white p-4">
                
                
                <div id="status" class="alert alert-info d-flex align-items-center rounded-3 mb-4" role="status">
                    <div class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></div>
                    <span>Felhasználók betöltése...</span>
                </div>

              
                <div class="table-responsive rounded-3 border" style="border-color: var(--emerald-border) !important;">
                    <table class="table table-hover table-emerald align-middle mb-0" >
                        <thead class="text-uppercase small fw-semibold">
                            <tr>
                                <th class="py-3 ps-4">Név</th>
                                <th class="py-3">E-mail</th>
                                <th class="py-3">Város</th>
                                <th class="py-3">Telefon</th>
                                <th class="py-3 pe-4 text-end">Szerepkör</th>
                                <th class="py-3 pe-4 text-end">Művelet</th>
                            </tr>
                        </thead>
                        <tbody id="users" class="border-top-0">
                           <tr>
                                <td class="py-3 ps-4">Név</td>
                                <td class="py-3">E-mail</td>
                                <td class="py-3">Város</td>
                                <td class="py-3">Telefon</td>
                                <td class="py-3 pe-4 text-end">Szerepkör</td>
                            </tr>
                        </tbody>
                    </table>
                </div>

            </div>
        </div>

        <div class="card border-0 shadow rounded-4 overflow-hidden mt-4">
            <div class="card-header emerald-header text-white border-0 py-3 px-4">
                <h2 class="h5 fw-bold mb-0">
                    <i class="bi bi-person-plus-fill me-2"></i>Új felhasználó hozzáadása
                </h2>
            </div>
            <div class="card-body bg-white p-4">
                <form id="form1">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label for="nev" class="form-label fw-semibold text-emerald">Név</label>
                            <input type="text" class="form-control" id="nev" placeholder="Add meg a nevet" required>
                        </div>
                        <div class="col-md-4">
                            <label for="email" class="form-label fw-semibold text-emerald">E-mail</label>
                            <input type="email" class="form-control" id="email" placeholder="pelda@email.hu" required>
                        </div>
                        <div class="col-md-4">
                            <label for="varos" class="form-label fw-semibold text-emerald">Város</label>
                            <input type="text" class="form-control" id="varos" placeholder="Város" required>
                        </div>
                        <div class="col-md-6">
                            <label for="telszam" class="form-label fw-semibold text-emerald">Telefonszám</label>
                            <input type="tel" class="form-control" id="telszam" placeholder="+36 30 123 4567" required>
                        </div>
                       <div class="col-md-6">
                            <label for="szerepkor" class="form-label fw-semibold text-emerald">Szerepkör</label>
                        <select class="form-select" id="szerepkor" required>
                            <option value="" selected disabled>Válassz szerepkört...</option>
                            <option value="Adminisztrátor">Adminisztrátor</option>
                            <option value="Szerkesztő">Szerkesztő</option>
                            <option value="Moderátor">Moderátor</option>
                            <option value="Felhasználó">Felhasználó</option>
                            <option value="Vendég">Vendég</option>
                        </select>
                        </div>
                    </div>
                    <div class="mt-4 d-flex justify-content-end">
                        <button type="submit" class="btn btn-irish px-4 py-2 fw-semibold">
                            <i class="bi bi-plus-circle me-2"></i>Hozzáadás
                        </button>
                    </div>
                </form>
            </div>
        </div>

    </main>


        

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="app.js"></script>
</body>
</html>
